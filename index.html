<head>
  <meta charset="utf-8" />

  <link rel="stylesheet" href="../shared/design-tokens.css" />
<link rel="stylesheet" href="./modern-styles.css" />
  <link rel="stylesheet" href="./styles.css" />
  <meta name="description" content="AI 智能体聚合大屏。P41 AI 智能体聚合大屏" />
  <meta property="og:title" content="P41 AI 智能体聚合大屏" />
  <meta property="og:description" content="AI 智能体聚合大屏 — 前端纯静态新闻工具" />
  <meta property="og:title" content="P41 AI 智能体聚合大屏" />
  <meta property="og:description" content="AI 智能体聚合大屏 — 前端纯静态新闻工具" />

  <link rel="manifest" href="./manifest.json" />
<style media="print">
.gnav,.pedagogy-panel,.explore-section,[class*="dark-toggle"],button[aria-label]{display:none!important}
body{background:#fff!important;color:#000!important;font-size:11pt}
.app,main,.container{box-shadow:none!important;border:none!important;padding:0!important}
a{color:#000!important;text-decoration:underline}
a[href]::after{content:" (" attr(href) ")";font-size:9pt;color:#666}
@page{margin:2cm}
</style>
</head>

<body>
  <main aria-label="主内容区域" class="app">
    <header class="hero">
      <h1>AI 新闻助手合集</h1>
      <p>集中管理多个 AI 入口，支持搜索、分类、一键打开与链接复制。</p>
      <input id="search" type="text" placeholder="搜索助手（名称/描述/标签）..." aria-label="搜索" />
      <p id="meta" class="meta">共 0 项</p>
    </header>

    <section class="card"><details class="teach-card" open><summary>🎓 AI 助手与新闻工作流</summary><p>现代新闻工作流中，AI 工具可以协助写作、事实核查、数据可视化、翻译等多个环节。本工具整合多个 AI 助手入口，支持分类、搜索、历史记录和自定义配置，方便记者快速切换不同工具。</p></details></section>

    <section class="panel">
      <div id="categories" class="chips"></div>
      <div class="batch-actions">
        <button id="copyAllBtn" type="button" class="btn-secondary">📋 复制全部链接</button>
        <button id="openAllBtn" type="button" class="btn-secondary">🌐 打开全部</button>
      </div>
    </section>

    <section class="grid" id="grid"></section>

    <section class="card">
      <h2>⏱ 最近使用</h2>
      <ul id="recentList" class="recent-list">
        <li class="empty-hint">暂无使用记录</li>
      </ul>
    </section>

    <section class="card">
      <h2>本地 JSON 配置</h2>
      <p class="hint">字段示例：id/name/desc/url/category/tags（tags 为数组）。</p>
      <textarea id="configInput" rows="8" aria-label="配置输入"></textarea>
      <div class="actions">
        <button id="applyConfigBtn" type="button">应用配置</button>
        <button id="resetConfigBtn" type="button">恢复默认</button>
      </div>
      <p id="status" aria-live="polite">状态: 就绪</p>
    </section>
  </main>
  <script src="./pm-metrics.js" defer></script>
<script src="./app.js" defer></script>

  <!-- Privacy Notice -->
  <div style="text-align:center;padding:12px 16px;font-size:12px;color:#888;border-top:1px solid #eee;margin-top:24px;">
    🔒 隐私提示：本工具所有数据处理均在您的浏览器本地完成，不会上传任何数据至服务器。
  </div>

  <!-- Cross-Project Navigation -->
  <nav aria-label="工具箱导航" style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:13px;border-top:1px solid #e5e5e5;margin-top:16px;color:#666;">
    <a href="https://yuuqq.github.io/journalism-toolbox/" style="text-decoration:none;">📋 工具箱导航</a>
    <span style="opacity:.4">P41</span>
  </nav>

<script src="../shared/dark-toggle.js" defer></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}</script>
<script src="../shared/cmd-palette.js" defer></script>
<script src="../shared/toast.js" defer></script>
<script src="../shared/onboarding.js" defer></script>
<script src="../shared/pedagogy-data-p1.js" defer></script>
<script src="../shared/pedagogy-data-p2.js" defer></script>
<script src="../shared/global-nav.js" defer></script>
<script src="../shared/kbd-hints.js" defer></script>
</body>

</html>
